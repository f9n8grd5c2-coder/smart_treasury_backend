name: Smart Treasury CI (Continuous Integration)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smart_treasury
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Configurazione Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Installazione dipendenze e driver database
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx psycopg2-binary

    - name: Creazione file .env completo per ambiente CI
      run: |
        echo "JWT_SECRET_KEY=chiave_segreta_di_test_per_ci_cd_123456789" > .env
        echo "AZIENDA_ID=az_001_ferramenta" >> .env
        echo "DB_HOST=127.0.0.1" >> .env
        echo "POSTGRES_HOST=127.0.0.1" >> .env
        echo "DB_PORT=5432" >> .env
        echo "POSTGRES_PORT=5432" >> .env
        echo "DB_USER=postgres" >> .env
        echo "POSTGRES_USER=postgres" >> .env
        echo "DB_PASSWORD=postgres" >> .env
        echo "POSTGRES_PASSWORD=postgres" >> .env
        echo "DB_NAME=smart_treasury" >> .env
        echo "POSTGRES_DB=smart_treasury" >> .env
        echo "DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/smart_treasury" >> .env

    - name: Inizializzazione Database e Utente di Test
      run: |
        python crea_utente_test.py

    - name: Esecuzione Test Automatici con Pytest
      run: |
        pytest -v