name: Smart Treasury CI (Continuous Integration)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    # Avvia automaticamente un container PostgreSQL temporaneo per i test
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smart_treasury
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Configurazione Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Installazione dipendenze
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx

    - name: Creazione file .env temporaneo per i test
      run: |
        echo "JWT_SECRET_KEY=chiave_segreta_di_test_per_ci_cd_123456789" > .env
        echo "AZIENDA_ID=az_001_ferramenta" >> .env
        echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/smart_treasury" >> .env

    - name: Esecuzione Test Automatici con Pytest
      run: |
        pytest -v