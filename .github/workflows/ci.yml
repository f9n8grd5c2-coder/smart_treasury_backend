name: Smart Treasury CI (Continuous Integration)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Configurazione Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Installazione dipendenze
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx

    - name: Configurazione variabili d'ambiente di test
      run: |
        echo "JWT_SECRET_KEY=chiave_segreta_di_test_per_ci_cd_123456789" > .env
        echo "AZIENDA_ID=az_001_ferramenta" >> .env
        echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/smart_treasury" >> .env

    - name: Esecuzione Test Automatici con Pytest
      run: |
        pytest -v